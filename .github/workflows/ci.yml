name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test

      - name: commit Cargo.lock (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain -- Cargo.lock | grep -q .; then
            git add Cargo.lock
            git commit -m "chore(ci): update Cargo.lock [skip ci]"
            git push
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            linker: ""
          - target: aarch64-unknown-linux-gnu
            linker: gcc-aarch64-linux-gnu
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cross linker (aarch64)
        if: matrix.linker != ''
        run: sudo apt-get update && sudo apt-get install -y "$TARGET_LINKER"
        env:
          TARGET_LINKER: ${{ matrix.linker }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: exported hooks (must be 8)
        run: |
          lib="target/${{ matrix.target }}/release/libexecfilter.so"
          count=$(nm -D --defined-only "$lib" | grep -cE ' T (execve|execv|execvp|execvpe|execl|execlp|posix_spawn|posix_spawnp)$')
          echo "hooks exported: $count/8"
          test "$count" -eq 8
          file "$lib" | grep -q ELF

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: libexecfilter-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libexecfilter.so

      - name: release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lib="target/${{ matrix.target }}/release/libexecfilter.so"
          sha256sum "$lib" > "libexecfilter-${{ matrix.target }}.so.sha256"
          gh release create "${GITHUB_REF_NAME}" --generate-notes \
            "$lib#libexecfilter-${{ matrix.target }}.so" \
            "libexecfilter-${{ matrix.target }}.so.sha256" \
          || gh release upload "${GITHUB_REF_NAME}" \
            "$lib#libexecfilter-${{ matrix.target }}.so" \
            "libexecfilter-${{ matrix.target }}.so.sha256" --clobber
